services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    volumes:
      - atlas_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      args:
        APP_GIT_SHA: ${APP_GIT_SHA:-unknown}
    environment:
      DATABASE_URL: postgresql+psycopg://atlas:atlas@db:5432/atlas
      MODEL_PROVIDER: ${MODEL_PROVIDER:-none}
      MODEL_NAME: ${MODEL_NAME:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      MODEL_CONNECT_TIMEOUT_SECONDS: ${MODEL_CONNECT_TIMEOUT_SECONDS:-5}
      MODEL_READ_TIMEOUT_SECONDS: ${MODEL_READ_TIMEOUT_SECONDS:-120}
      MODEL_WRITE_TIMEOUT_SECONDS: ${MODEL_WRITE_TIMEOUT_SECONDS:-10}
      MODEL_POOL_TIMEOUT_SECONDS: ${MODEL_POOL_TIMEOUT_SECONDS:-2}
      MODEL_TOTAL_TIMEOUT_SECONDS: ${MODEL_TOTAL_TIMEOUT_SECONDS:-150}
      MODEL_QUEUE_TIMEOUT_SECONDS: ${MODEL_QUEUE_TIMEOUT_SECONDS:-1}
      MODEL_MAX_RETRIES: ${MODEL_MAX_RETRIES:-2}
      MODEL_RETRY_BASE_SECONDS: ${MODEL_RETRY_BASE_SECONDS:-0.5}
      MODEL_MAX_CONCURRENCY: ${MODEL_MAX_CONCURRENCY:-4}
      MODEL_MAX_TOKENS: ${MODEL_MAX_TOKENS:-2048}
      MODEL_MAX_PROMPT_CHARS: ${MODEL_MAX_PROMPT_CHARS:-100000}
      MODEL_MAX_RESPONSE_CHARS: ${MODEL_MAX_RESPONSE_CHARS:-100000}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-legacy}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embeddinggemma:300m-qat-q4_0}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:11434}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-60}
      SEMANTIC_MIN_SCORE: ${SEMANTIC_MIN_SCORE:-0.40}
      SEMANTIC_EXPANSION_MIN_SCORE: ${SEMANTIC_EXPANSION_MIN_SCORE:-0.38}
      HYBRID_MIN_SCORE: ${HYBRID_MIN_SCORE:-0.423}
      RETRIEVAL_CANDIDATE_LIMIT: ${RETRIEVAL_CANDIDATE_LIMIT:-100}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      MAX_STORAGE_BYTES: ${MAX_STORAGE_BYTES:-1073741824}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,api,testserver}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  atlas_db:
